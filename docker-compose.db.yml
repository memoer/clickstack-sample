services:
  # ============================================================================
  # ClickStack (HyperDX + ClickHouse + OTel Collector)
  # 
  # 다른 백엔드로 전환하려면 이 서비스를 교체하세요:
  # - Jaeger: jaegertracing/all-in-one
  # - Grafana Tempo + Loki + Prometheus
  # - etc.
  # ============================================================================
  clickstack:
    image: docker.hyperdx.io/hyperdx/hyperdx-all-in-one
    ports:
      - "8080:8080"   # HyperDX UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9000:9000"   # ClickHouse native port
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse    # 텔레메트리 데이터 (로그, 트레이스, 메트릭)
      - ./data/mongo:/data/db                    # 사용자 계정, 대시보드, 알림 설정
      - ./data/log:/var/log                      # clickhouse, hyperdx 관련 로그
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sample

  # ============================================================================
  # Databases for multi-database demo
  # ============================================================================
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sample

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sample

  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clickstack
      POSTGRES_PASSWORD: clickstack
      POSTGRES_DB: clickstack
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickstack"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sample

networks:
  sample:
    driver: bridge