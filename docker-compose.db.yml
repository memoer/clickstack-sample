services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - ./_mount/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sample

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - ./_mount/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sample

  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clickstack
      POSTGRES_PASSWORD: clickstack
      POSTGRES_DB: clickstack
    volumes:
      - ./_mount/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickstack"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sample

networks:
  sample:
    driver: bridge