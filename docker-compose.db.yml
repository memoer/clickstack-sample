services:
  # ============================================================================
  # OTEL Collector (Tail-Based Sampling)
  #
  # Backend → OTEL Collector → ClickStack
  #
  # tail-based sampling을 수행합니다:
  # - 에러 트레이스: 100% 보존
  # - 정상 트레이스: 10% 샘플링
  # ============================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC (Backend → Collector)
      - "4318:4318"   # OTLP HTTP (Backend → Collector)
      - "13133:13133" # Health check
      - "8888:8888"   # Collector metrics
    volumes:
      - ./data/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      clickstack:
        condition: service_healthy
    # Note: otel-collector-contrib is a distroless image (no wget/curl)
    # Health is verified via external check: curl http://localhost:13133/
    healthcheck:
      test: ["NONE"]
    networks:
      - sample

  # ============================================================================
  # ClickStack (HyperDX + ClickHouse)
  #
  # OTEL Collector에서 샘플링된 데이터를 받습니다.
  # 다른 백엔드로 전환하려면 이 서비스를 교체하세요:
  # - Jaeger: jaegertracing/all-in-one
  # - Grafana Tempo + Loki + Prometheus
  # - etc.
  # ============================================================================
  clickstack:
    image: docker.hyperdx.io/hyperdx/hyperdx-all-in-one
    ports:
      - "8080:8080"   # HyperDX UI
      - "8123:8123"   # Clickhouse
      - "9000:9000"   # ClickHouse native port
    # 내부 OTLP 포트는 otel-collector에서만 접근 (외부 노출 안함)
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./data/clickstack/clickhouse:/var/lib/clickhouse    # 텔레메트리 데이터 (로그, 트레이스, 메트릭)
      - ./data/clickstack/mongodb:/data/db                    # 사용자 계정, 대시보드, 알림 설정
      - ./data/clickstack/log:/var/log                      # clickhouse, hyperdx 관련 로그
    healthcheck:
      # HyperDX doesn't have /health endpoint, check if UI is accessible
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s  # Give HyperDX time to start up
    networks:
      - sample

  # ============================================================================
  # Databases for multi-database demo
  # ============================================================================
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sample

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sample

  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clickstack
      POSTGRES_PASSWORD: clickstack
      POSTGRES_DB: clickstack
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickstack"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sample

networks:
  sample:
    driver: bridge